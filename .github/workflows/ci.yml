name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prompt-engineering.json
        run: |
          python3 - <<'EOF'
          import json, re

          required = {"name", "url", "description", "category",
                      "verified", "verified_date", "verified_source"}
          categories = {"technique", "framework", "tooling", "evaluation",
                        "guide", "paper", "security"}
          path = "data/prompt-engineering.json"
          data = json.load(open(path))
          assert isinstance(data, list) and data, f"{path} must be a non-empty list"
          for i, e in enumerate(data):
              missing = required - e.keys()
              assert not missing, f"entry {i} ({e.get('name')}) missing {missing}"
              assert e["category"] in categories, f"entry {i} bad category {e['category']}"
              assert isinstance(e["verified"], bool), \
                  f"entry {i} verified not bool"
              assert e["url"].startswith("https://"), f"entry {i} url must be https"
              assert isinstance(e["description"], str) and e["description"].strip(), \
                  f"entry {i} description must be non-empty"
              if e["verified"]:
                  assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", e["verified_date"]), \
                      f"entry {i} verified_date must be YYYY-MM-DD"
                  assert isinstance(e["verified_source"], str) and e["verified_source"].strip(), \
                      f"entry {i} verified entry needs verified_source"
          names = [e["name"] for e in data]
          assert len(names) == len(set(names)), f"{path} duplicate names"
          print(f"OK: {path}: {len(data)} entries validated")
          verified = sum(1 for e in data if e["verified"])
          print(f"OK: {verified}/{len(data)} entries verified on official sources")
          EOF
